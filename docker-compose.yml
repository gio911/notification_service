version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"  # AMQP порт
      - "15672:15672"  # Веб-интерфейс управления
    container_name: rabbitmq_container
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      retries: 3
      start_period: 5s
      timeout: 5s
    networks:
      - rmq-network

  fastapi_producer:
    build:
      context: .
      dockerfile: fastapi_producer/Dockerfile
    # command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    container_name: fastapi_producer_container
    ports:
      - "8000:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      auth_postgres:
        condition: service_healthy
    env_file:
      - ./.env
    networks:
      - rmq-network


  consumer:
    build:
      context: .
      dockerfile: consumer/Dockerfile
    # command: python consumer.py
    container_name: consumer_container
    volumes:
      - ./consumer:/app
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file:
      - ./.env
    networks:
      - rmq-network

  
  auth_postgres:
    image: postgres:14
    container_name: auth_postgres
    restart: always
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - user_auth_db:/var/lib/postgresql/data/
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_AUTH}"]
      interval: 2s
      timeout: 3s
      retries: 3
    networks:
      - rmq-network

  auth:
    build: ./auth_service
    container_name: auth_service
    env_file:
      - ./.env  
    depends_on:
      rabbitmq:
        condition: service_healthy
      auth_postgres:
        condition: service_healthy
    ports:
      - "8001:8001" 
    volumes:
      - ./auth_service:/app
    networks:
      - rmq-network

  email_deliver_service:
    build: ./email_deliver_service
    container_name: email_deliver_service
    env_file:
      - ./.env  
    depends_on:
      rabbitmq:
        condition: service_healthy
      auth_postgres:
        condition: service_healthy
    ports:
      - "8003:8003" 
    volumes:
      - ./email_deliver_service:/app
    networks:
      - rmq-network

networks:
  rmq-network:
    driver: bridge

volumes:
  user_auth_db:
